# Connector smoke tests — runs on every PR that touches connector
# code, plus on the main branch as a safety net.
#
# Two stages:
#   1. Dry-run all manifests (no network) — fails the build if any
#      manifest at Beta tier or higher fails dry-run.
#   2. Live smoke for the allow-listed subset only — skips cleanly
#      when secrets aren't present (forks, contributor PRs).
#
# A red live-smoke for a Verified connector demotes it to Beta
# automatically: the workflow writes
# `backend/fpulse/connectors/ci/last_smoke_status.json` which the
# `cert_matrix.py` tier computation reads.

name: connector-smoke

on:
  pull_request:
    paths:
      - 'backend/fpulse/connectors/**'
      - 'backend/fpulse/api/cert_matrix.py'
      - 'tools/test_connector.py'
      - '.github/workflows/connector-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'backend/fpulse/connectors/**'

jobs:
  dry-run-all:
    name: Dry-run every manifest (no network)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install F-Pulse + minimum deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyyaml

      - name: Dry-run every manifest
        # Iterate every connector id; --dry-run does NOT hit the network
        # so this stage is safe for forks. A non-zero exit for any
        # Beta-or-higher connector fails the build. Experimental +
        # Hidden are reported but non-blocking.
        run: |
          set -e
          python tools/test_connector.py --list > /tmp/connectors.txt
          failed_blocking=()
          failed_nonblocking=()
          for id in $(awk '/^  [a-z]/ {print $1}' /tmp/connectors.txt); do
            echo "::group::dry-run $id"
            if python tools/test_connector.py "$id" --dry-run; then
              echo "ok"
            else
              # Look up the tier from cert-matrix; only Beta+ fail the build.
              tier=$(python -c "from fpulse.api.cert_matrix import cert_matrix; r=cert_matrix(include_hidden=True); print(next((x['tier'] for x in r['rows'] if x['id']=='$id'), 'experimental'))")
              if [ "$tier" = "production" ] || [ "$tier" = "verified" ] || [ "$tier" = "beta" ]; then
                failed_blocking+=("$id ($tier)")
              else
                failed_nonblocking+=("$id ($tier)")
              fi
            fi
            echo "::endgroup::"
          done
          if [ ${#failed_nonblocking[@]} -gt 0 ]; then
            echo "::warning::Non-blocking dry-run failures (Experimental tier): ${failed_nonblocking[*]}"
          fi
          if [ ${#failed_blocking[@]} -gt 0 ]; then
            echo "::error::Blocking dry-run failures (Beta+ tier): ${failed_blocking[*]}"
            exit 1
          fi

  live-smoke:
    name: Live smoke (allow-listed connectors only)
    runs-on: ubuntu-latest
    needs: dry-run-all
    # Don't run on forks — forks have no access to repository secrets,
    # and a no-op live-smoke job creates confusing CI noise.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install F-Pulse + minimum deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pyyaml

      - name: Live smoke (allow-listed)
        env:
          # Secrets are passed through env. Each connector entry in
          # live_smoke.yml declares which env vars it needs. The
          # workflow injects ALL secret names referenced by any
          # allow-list entry; per-connector skip logic lives in
          # tools/test_connector.py.
          GITHUB_SMOKE_TOKEN: ${{ secrets.GITHUB_SMOKE_TOKEN }}
          STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}
          HUBSPOT_DEV_TOKEN: ${{ secrets.HUBSPOT_DEV_TOKEN }}
          SHOPIFY_PARTNER_TOKEN: ${{ secrets.SHOPIFY_PARTNER_TOKEN }}
          SERVICENOW_PDI_URL: ${{ secrets.SERVICENOW_PDI_URL }}
          SERVICENOW_PDI_USER: ${{ secrets.SERVICENOW_PDI_USER }}
          SERVICENOW_PDI_PASS: ${{ secrets.SERVICENOW_PDI_PASS }}
        run: |
          set -e
          python tools/test_connector.py --live-batch \
            --allowlist backend/fpulse/connectors/ci/live_smoke.yml \
            --status-out backend/fpulse/connectors/ci/last_smoke_status.json

      - name: Upload last-smoke-status artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: last-smoke-status
          path: backend/fpulse/connectors/ci/last_smoke_status.json
          if-no-files-found: ignore
