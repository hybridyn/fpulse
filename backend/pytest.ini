[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
pythonpath = . ..
# Lifecycle regressions are part of the default gate. Stress and full API
# lifecycle suites are explicit separate runs; external tests need services.
addopts =
    -v --tb=short --strict-markers
    -m "not stress and not e2e and not external"
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    unit: pure unit tests — no app_state, no DB, no network
    integration: integration tests requiring app_state / DB fixtures
    e2e: full API lifecycle tests (TestClient + lifespan)
    stress: load / stress / concurrency tests (deselect for fast runs)
    external: requires an external service (Postgres, S3, an API)
    security: security-specific assertions (encryption at rest, redaction)

# 2026-05-31: pytest-asyncio 1.x defaults to strict mode (requires
# @pytest.mark.asyncio on every async test). Our codebase has async
# tests both with AND without the explicit marker. Set auto mode to
# match what `pyproject.toml [tool.pytest.ini_options]` already
# declares — pytest reads THIS file (pytest.ini) first when invoked
# from backend/, so the pyproject setting was silently being ignored.
# Without this, CI's `pip install -r requirements-dev.txt` pulls
# pytest-asyncio>=0.23 → 1.x → strict mode → unmarked async tests
# fail with "async def functions are not natively supported".
asyncio_mode = auto
